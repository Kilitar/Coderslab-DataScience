<!DOCTYPE html>
<!--
  Minimální obousměrná Streamlit komponenta bez npm buildu (čistý postMessage protokol).
  Kreslicí plátno 280x280 px -> při každém dokončení tahu odešle do Pythonu
  matici 56x56 (průměrování bloků 5x5, hodnoty 0..1).
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: "Inter", "Segoe UI", sans-serif; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px; }
  canvas {
    background: #000; border-radius: 14px; cursor: crosshair; touch-action: none;
    box-shadow: 0 0 0 2px #334155, 0 8px 28px rgba(59, 130, 246, 0.35);
  }
  .row { display: flex; gap: 8px; }
  button {
    border: none; border-radius: 10px; padding: 8px 16px; font-weight: 600; cursor: pointer;
    color: #fff; background: linear-gradient(135deg, #6366f1, #3b82f6); transition: transform .12s, opacity .12s;
  }
  button.secondary { background: linear-gradient(135deg, #475569, #334155); }
  button:hover { transform: translateY(-1px); opacity: .92; }
  .hint { color: #94a3b8; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="280" height="280"></canvas>
  <div class="row">
    <button id="clear" class="secondary">🧽 Smazat</button>
    <button id="thin">✏️ Tenčí</button>
    <button id="thick">🖌️ Silnější</button>
  </div>
  <div class="hint" id="hint">Nakreslete jednu číslici 0–9 doprostřed plátna</div>
</div>
<script>
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let drawing = false, last = null, lineWidth = 20, strokes = 0;

  function sendMessage(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
  }
  function setFrameHeight() { sendMessage("streamlit:setFrameHeight", { height: document.body.scrollHeight + 8 }); }
  function reset() {
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX - r.left) * canvas.width / r.width, y: (p.clientY - r.top) * canvas.height / r.height };
  }
  function line(a, b) {
    ctx.strokeStyle = "#fff"; ctx.lineWidth = lineWidth; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  function emit() {
    // Downsampling 280x280 -> 56x56 (blok 5x5), hodnota = průměrná intenzita červeného kanálu
    const img = ctx.getImageData(0, 0, 280, 280).data;
    const out = [];
    for (let by = 0; by < 56; by++) {
      const row = [];
      for (let bx = 0; bx < 56; bx++) {
        let s = 0;
        for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) {
          s += img[((by * 5 + y) * 280 + (bx * 5 + x)) * 4];
        }
        row.push(Math.round((s / 25 / 255) * 1000) / 1000);
      }
      out.push(row);
    }
    strokes += 1;
    sendMessage("streamlit:setComponentValue", { value: { pixels: out, strokes: strokes }, dataType: "json" });
  }

  canvas.addEventListener("mousedown", e => { drawing = true; last = pos(e); line(last, last); });
  canvas.addEventListener("mousemove", e => { if (!drawing) return; const p = pos(e); line(last, p); last = p; });
  window.addEventListener("mouseup", () => { if (drawing) { drawing = false; emit(); } });
  canvas.addEventListener("touchstart", e => { e.preventDefault(); drawing = true; last = pos(e); line(last, last); }, { passive: false });
  canvas.addEventListener("touchmove", e => { e.preventDefault(); if (!drawing) return; const p = pos(e); line(last, p); last = p; }, { passive: false });
  canvas.addEventListener("touchend", () => { if (drawing) { drawing = false; emit(); } });

  document.getElementById("clear").onclick = () => {
    reset(); strokes += 1;
    sendMessage("streamlit:setComponentValue", { value: { pixels: null, strokes: strokes }, dataType: "json" });
  };
  document.getElementById("thin").onclick = () => { lineWidth = Math.max(10, lineWidth - 4); document.getElementById("hint").innerText = "Tloušťka štětce: " + lineWidth + " px"; };
  document.getElementById("thick").onclick = () => { lineWidth = Math.min(36, lineWidth + 4); document.getElementById("hint").innerText = "Tloušťka štětce: " + lineWidth + " px"; };

  window.addEventListener("message", e => {
    if (e.data && e.data.type === "streamlit:render") setFrameHeight();
  });

  reset();
  sendMessage("streamlit:componentReady", { apiVersion: 1 });
  setFrameHeight();
</script>
</body>
</html>
